<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STREETS OF DESTINY — Prototype</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111820; color: #fff; font-family: system-ui, sans-serif; }
    #hud { position: fixed; inset: 18px auto auto 18px; z-index: 2; padding: 12px 16px; border: 1px solid #ffffff33; border-radius: 10px; background: #101820cc; line-height: 1.5; }
    #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 2; padding: 10px 14px; border-radius: 8px; background: #101820dd; color: #e9edf0; white-space: nowrap; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="hud"><strong>STREETS OF DESTINY</strong><br>Prototype 0.6 · New Town District<br><span id="status">Explore the neighbourhood</span></div>
  <div id="hint">WASD / Arrow keys: move · Mouse drag: look around · E: interact</div>
  <div id="mission" style="position:fixed;top:18px;right:18px;z-index:2;max-width:260px;padding:12px 16px;border:1px solid #ffffff33;border-radius:10px;background:#101820cc;line-height:1.5"><strong>FIRST MEETING</strong><br><span id="objective">Find Ama near the meeting point.</span></div>
  <div id="dialogue" style="display:none;position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:3;width:min(520px,calc(100% - 40px));padding:16px 18px;border:1px solid #ffffff55;border-radius:12px;background:#101820f2;line-height:1.55;text-align:center"><strong>Ama</strong><br><span id="dialogueText"></span><br><small>Press E to close</small></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9bb6c5);
    scene.fog = new THREE.Fog(0x9bb6c5, 35, 115);

    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 250);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xddeeff, 0x59604c, 2.1));
    const sun = new THREE.DirectionalLight(0xffe0b0, 2.3);
    sun.position.set(-18, 32, 16);
    sun.castShadow = true;
    scene.add(sun);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(180, 180), new THREE.MeshStandardMaterial({ color: 0x687568 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    function box(w,h,d,color,x,y,z) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({ color, roughness: 0.88 }));
      mesh.position.set(x,y,z); mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh); return mesh;
    }

    // Main road and pavements
    box(13, 0.12, 150, 0x343b40, 0, 0.06, 0);
    box(2.2, 0.2, 150, 0x9b9788, -7.6, 0.12, 0);
    box(2.2, 0.2, 150, 0x9b9788, 7.6, 0.12, 0);
    for (let z = -65; z < 70; z += 10) box(0.16, 0.025, 4.5, 0xe7d9a6, 0, 0.14, z);

    // Original fictional neighbourhood blocks
    const palette = [0xb77b55, 0xc8b28a, 0x8d9a91, 0xd0c4aa, 0x9d6958, 0xb5a18a];
    for (let i = 0; i < 22; i++) {
      const side = i % 2 ? 1 : -1;
      const z = -58 + i * 5.5;
      const h = 5 + (i % 5) * 1.8;
      const w = 5 + (i % 3);
      const x = side * (13 + (i % 2) * 2);
      box(w, h, 4.5, palette[i % palette.length], x, h / 2, z);
      for (let yy = 1.8; yy < h - 0.5; yy += 2.2) {
        for (let xx = -w/2 + 0.9; xx < w/2 - 0.3; xx += 1.7) {
          box(0.75, 0.9, 0.08, 0x344b59, x + xx, yy, z - 2.29);
        }
      }
    }

    // Player placeholder
    const player = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.48, 1.0, 4, 8), new THREE.MeshStandardMaterial({ color: 0x263d56 }));
    body.position.y = 1.15; body.castShadow = true; player.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 12), new THREE.MeshStandardMaterial({ color: 0x8d5d43 }));
    head.position.y = 2.05; head.castShadow = true; player.add(head);
    player.position.set(0, 0, 12); scene.add(player);

    // Mission marker
    const marker = new THREE.Group();
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.35, 0.12, 8, 32), new THREE.MeshStandardMaterial({ color: 0xffd34e, emissive: 0x8a5a00 }));
    ring.rotation.x = Math.PI / 2; ring.position.y = 0.25; marker.add(ring);
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3, 12), new THREE.MeshBasicMaterial({ color: 0xffd34e, transparent: true, opacity: 0.55 }));
    beam.position.y = 1.8; marker.add(beam); marker.position.set(0,0,-12); scene.add(marker);

    // Ama, the first story contact
    const ama = new THREE.Group();
    const amaBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.43, 0.95, 4, 8), new THREE.MeshStandardMaterial({ color: 0x9b6b32 }));
    amaBody.position.y = 1.1; ama.add(amaBody);
    const amaHead = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), new THREE.MeshStandardMaterial({ color: 0x8d5d43 }));
    amaHead.position.y = 1.95; ama.add(amaHead);
    ama.position.set(2.8, 0, -12); scene.add(ama);

    // Community workshop: the next destination in Marcus's story
    box(7, 5.5, 6, 0x806044, -11.5, 2.75, -39);
    box(7.2, 0.35, 6.2, 0x493a30, -11.5, 5.65, -39);
    box(2.2, 2.4, 0.12, 0x263d45, -11.5, 1.45, -35.92);
    box(1.15, 1.1, 0.14, 0xd9b77c, -13.4, 3.4, -35.9);
    box(1.15, 1.1, 0.14, 0xd9b77c, -9.6, 3.4, -35.9);
    const workshopMarker = new THREE.Group();
    const workshopRing = new THREE.Mesh(new THREE.TorusGeometry(1.35, 0.12, 8, 32), new THREE.MeshStandardMaterial({ color: 0x54e0b0, emissive: 0x145c43 }));
    workshopRing.rotation.x = Math.PI / 2;
    workshopRing.position.y = 0.25;
    workshopMarker.add(workshopRing);
    const workshopBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 2.7, 12), new THREE.MeshBasicMaterial({ color: 0x54e0b0, transparent: true, opacity: 0.5 }));
    workshopBeam.position.y = 1.65;
    workshopMarker.add(workshopBeam);
    workshopMarker.position.set(-1.5, 0, -39);
    scene.add(workshopMarker);

    // Kofi, a workshop volunteer who introduces the next story thread
    const kofi = new THREE.Group();
    const kofiBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.43, 0.95, 4, 8), new THREE.MeshStandardMaterial({ color: 0x315b54 }));
    kofiBody.position.y = 1.1;
    kofi.add(kofiBody);
    const kofiHead = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), new THREE.MeshStandardMaterial({ color: 0x80543d }));
    kofiHead.position.y = 1.95;
    kofi.add(kofiHead);
    kofi.position.set(-4.1, 0, -42);
    scene.add(kofi);


    // Benedict, a mysterious and influential stranger inspired by the supplied character reference.
    // The browser prototype uses original 3D placeholder geometry; the reference portrait can be added as a separate art asset later.
    const benedict = new THREE.Group();
    const benedictDark = new THREE.MeshStandardMaterial({ color: 0x171b22, roughness: 0.48, metalness: 0.35 });
    const benedictGold = new THREE.MeshStandardMaterial({ color: 0xc58a25, roughness: 0.34, metalness: 0.72 });
    const benedictBlue = new THREE.MeshStandardMaterial({ color: 0x08b9e8, emissive: 0x07506b, metalness: 0.55 });
    const benedictSkin = new THREE.MeshStandardMaterial({ color: 0x754a35, roughness: 0.9 });
    const bBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.48, 1.05, 4, 8), benedictDark);
    bBody.position.y = 1.15; bBody.castShadow = true; benedict.add(bBody);
    const bHead = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 12), benedictSkin);
    bHead.position.y = 2.08; bHead.castShadow = true; benedict.add(bHead);
    const bCape = new THREE.Mesh(new THREE.ConeGeometry(1.05, 3.1, 4, 1, true), benedictDark);
    bCape.position.set(0, 1.55, 0.48); bCape.rotation.x = Math.PI; bCape.rotation.z = 0.12; bCape.castShadow = true; benedict.add(bCape);
    const bShoulder = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.34, 0.72), benedictGold);
    bShoulder.position.set(0, 1.72, 0); bShoulder.rotation.z = -0.08; bShoulder.castShadow = true; benedict.add(bShoulder);
    const bChest = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.72, 0.18), benedictGold);
    bChest.position.set(0, 1.23, -0.42); bChest.castShadow = true; benedict.add(bChest);
    const bCore = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.62, 0.08), benedictBlue);
    bCore.position.set(0, 1.25, -0.53); benedict.add(bCore);
    for (const side of [-1, 1]) {
      const plate = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.65, 0.42), benedictGold);
      plate.position.set(side * 0.48, 1.12, -0.05); plate.rotation.z = side * -0.16; benedict.add(plate);
      const light = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.48, 0.05), benedictBlue);
      light.position.set(side * 0.49, 1.1, -0.29); benedict.add(light);
    }
    benedict.position.set(2.7, 0, -55);
    benedict.rotation.y = Math.PI;
    scene.add(benedict);


    // Benedict's waterfront office: a compact, explorable-feeling exterior landmark.
    box(8, 7, 7, 0x39434a, -12.5, 3.5, -65);
    box(8.3, 0.4, 7.3, 0x171e26, -12.5, 7.2, -65);
    box(2.1, 3.2, 0.18, 0x172d3a, -12.5, 1.7, -61.4);
    box(1.1, 1.35, 0.12, 0x42a9c2, -15.1, 4.2, -61.35);
    box(1.1, 1.35, 0.12, 0x42a9c2, -9.9, 4.2, -61.35);
    box(4.2, 0.8, 0.25, 0xb88739, -12.5, 5.7, -61.25);
    const officeMarker = new THREE.Group();
    const officeRing = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.12, 8, 32), new THREE.MeshStandardMaterial({ color: 0x64c9ff, emissive: 0x164a78 }));
    officeRing.rotation.x = Math.PI / 2; officeRing.position.y = 0.22; officeMarker.add(officeRing);
    const officeBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 2.5, 12), new THREE.MeshBasicMaterial({ color: 0x64c9ff, transparent: true, opacity: 0.48 }));
    officeBeam.position.y = 1.55; officeMarker.add(officeBeam);
    officeMarker.position.set(-4.4, 0, -65); scene.add(officeMarker);

    // Nana, the office coordinator. She is the first person Marcus meets at the waterfront office.
    const nana = new THREE.Group();
    const nanaBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.92, 4, 8), new THREE.MeshStandardMaterial({ color: 0x7650a2 }));
    nanaBody.position.y = 1.08; nana.add(nanaBody);
    const nanaHead = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), new THREE.MeshStandardMaterial({ color: 0x80543d }));
    nanaHead.position.y = 1.92; nana.add(nanaHead);
    nana.position.set(1.8, 0, -67); scene.add(nana);


    // Private meeting point overlooking the waterfront.
    box(9, 0.35, 8, 0x28343b, 0, 0.22, -70);
    box(9.4, 0.25, 8.4, 0x151e25, 0, 4.1, -70);
    for (const x of [-4.2, 4.2]) box(0.22, 4, 0.22, 0xb88739, x, 2.1, -70);
    const meetingMarker = new THREE.Group();
    const meetingRing = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.12, 8, 32), new THREE.MeshStandardMaterial({ color: 0xffc45c, emissive: 0x80501a }));
    meetingRing.rotation.x = Math.PI / 2; meetingRing.position.y = 0.22; meetingMarker.add(meetingRing);
    meetingMarker.position.set(0, 0, -70); scene.add(meetingMarker);

    const keys = {};
    addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    let yaw = 0, dragging = false, lastX = 0;
    renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; });
    addEventListener('pointerup', () => dragging = false);
    addEventListener('pointermove', e => { if (dragging) { yaw -= (e.clientX - lastX) * 0.006; lastX = e.clientX; } });

    const status = document.getElementById('status');
    const objective = document.getElementById('objective');
    const dialogue = document.getElementById('dialogue');
    const dialogueText = document.getElementById('dialogueText');
    let missionStage = 0;
    let dialogueOpen = false;
    let eWasDown = false;
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.04);
      const forward = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
      const sideways = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
      const direction = new THREE.Vector3(sideways, 0, -forward).normalize().applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
      player.position.addScaledVector(direction, dt * 7);
      player.position.x = THREE.MathUtils.clamp(player.position.x, -5.5, 5.5);
      player.position.z = THREE.MathUtils.clamp(player.position.z, -72, 72);
      if (direction.lengthSq() > 0) player.rotation.y = Math.atan2(direction.x, direction.z);
      ring.rotation.z += dt * 0.7;
      const target = player.position.clone().add(new THREE.Vector3(0, 3.2, 7.5).applyAxisAngle(new THREE.Vector3(0,1,0), yaw));
      camera.position.lerp(target, 0.09);
      camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
      const nearAma = player.position.distanceTo(ama.position) < 3.2;
      const nearWorkshop = player.position.distanceTo(workshopMarker.position) < 3.4;
      const nearKofi = player.position.distanceTo(kofi.position) < 3.2;
      const nearBenedict = player.position.distanceTo(benedict.position) < 3.5;
      const nearOffice = player.position.distanceTo(officeMarker.position) < 3.4;
      const nearNana = player.position.distanceTo(nana.position) < 3.2;
      const nearMeeting = player.position.distanceTo(meetingMarker.position) < 3.4;
      const eDown = !!keys.e;
      if (nearAma && missionStage === 0) status.textContent = 'Ama is nearby — press E to talk';
      else if (nearWorkshop && missionStage === 1) status.textContent = 'Community workshop — press E to enter';
      else if (nearKofi && missionStage === 2) status.textContent = 'Kofi is ready to talk — press E';
      else if (nearBenedict && missionStage === 3) status.textContent = 'A stranger is waiting — press E';
      else if (nearAma && missionStage === 4) status.textContent = 'Ask Ama about Benedict — press E';
      else if (nearOffice && missionStage === 5) status.textContent = 'Benedict’s waterfront office — press E';
      else if (nearNana && missionStage === 6) status.textContent = 'Nana is ready to speak — press E';
      else if (nearMeeting && missionStage === 7) status.textContent = 'Benedict’s private meeting — press E';
      else if (missionStage === 8) status.textContent = 'Choose: press 1 to hear him out or 2 to decline';
      else if (missionStage === 9) status.textContent = 'Benedict has shared a confidential proposal';
      else if (missionStage === 10) status.textContent = 'You declined Benedict’s invitation';
      else status.textContent = 'Explore the neighbourhood';

      if (nearAma && eDown && !eWasDown && missionStage === 0) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Ama';
        dialogueText.textContent = 'Marcus? It has been a long time. The neighbourhood has changed, but people still remember you. Come by the workshop when you are ready.';
        missionStage = 1;
        objective.textContent = 'Completed: Meet Ama. Next: Visit the community workshop.';
      } else if (nearWorkshop && eDown && !eWasDown && missionStage === 1) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Community workshop';
        dialogueText.textContent = 'The workshop is still a place where neighbours share skills and help one another. Ama has left a note for you: start by checking in with the people who kept this place running.';
        missionStage = 2;
        objective.textContent = 'Completed: Visit the community workshop. Next: Speak with Kofi.';
      } else if (nearKofi && eDown && !eWasDown && missionStage === 2) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Kofi';
        dialogueText.textContent = 'Ama said you might come by. We are trying to keep this workshop open for the young people in the area. The roof needs repairs, and the neighbours are organising a weekend fundraiser. If you want to help, speak with Ama about how to bring everyone together.';
        missionStage = 3;
        objective.textContent = 'Chapter 1 introduction complete. Next: Find Ama and discuss the community fundraiser.';
        status.textContent = 'Chapter 1 introduction complete';
      } else if (nearBenedict && eDown && !eWasDown && missionStage === 3) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Benedict — The Stranger';
        dialogueText.textContent = 'You have been asking questions about this neighbourhood, Marcus. Names carry weight here, and mine opens doors you have not even noticed yet. I can offer you an opportunity, but first you should decide who you can trust. We will speak again.';
        missionStage = 4;
        objective.textContent = 'New contact: Benedict. A powerful stranger has taken an interest in Marcus. Find out why.';
      } else if (nearAma && eDown && !eWasDown && missionStage === 4) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Ama';
        dialogueText.textContent = 'Benedict? I know the name. He has funded projects around New Town, but nobody seems to know where his money really comes from. Some people admire him; others keep their distance. If he has approached you, Marcus, take your time before accepting anything. I heard he has an office near the old waterfront. That may be your next lead.';
        missionStage = 5;
        objective.textContent = 'New lead: Ask around about Benedict’s waterfront office. Find out why he is interested in Marcus.';
      } else if (nearOffice && eDown && !eWasDown && missionStage === 5) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Waterfront Office';
        dialogueText.textContent = 'The building is quieter than the busy street outside. A discreet reception desk sits behind the glass entrance. A woman notices Marcus approaching and steps outside to meet him.';
        missionStage = 6;
        objective.textContent = 'At the waterfront office: Speak with Nana, the office coordinator.';
      } else if (nearNana && eDown && !eWasDown && missionStage === 6) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Nana — Office Coordinator';
        dialogueText.textContent = 'You must be Marcus. Mr Benedict said you might come by. He is away at the moment, but he left a message: he would like to meet you privately tomorrow. I cannot tell you what he wants. You will have to ask him yourself.';
        missionStage = 7;
        objective.textContent = 'New objective: Decide whether to accept Benedict’s invitation. Chapter 1 continues.';
      } else if (nearMeeting && eDown && !eWasDown && missionStage === 7) {
        benedict.position.set(2.7, 0, -69);
        benedict.rotation.y = Math.PI;
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Benedict — Private Meeting';
        dialogueText.textContent = 'Marcus, I have watched how you returned to this neighbourhood and listened before making promises. I am putting together a city renewal initiative. I want you involved, but trust should never be demanded. You have a choice: hear my proposal, or walk away. Press 1 to hear him out, or 2 to decline.';
        missionStage = 8;
        objective.textContent = 'Decision: Will Marcus hear Benedict’s proposal or decline the invitation?';
      } else if (missionStage === 8 && keys['1']) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Benedict — The Proposal';
        dialogueText.textContent = 'Good. I want to restore the waterfront and create paid training opportunities through the workshop. The plan is ambitious, and I will show you the details before asking for any commitment. Meet me again when you are ready to review them.';
        missionStage = 9;
        objective.textContent = 'New objective: Review Benedict’s waterfront renewal proposal before making any commitment.';
      } else if (missionStage === 8 && keys['2']) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Benedict — A Different Path';
        dialogueText.textContent = 'I respect a careful decision, Marcus. The invitation will remain open. Take time to understand what matters to you and the people here. We may speak again.';
        missionStage = 10;
        objective.textContent = 'You declined for now. Continue helping the New Town community; Benedict’s invitation may return later.';
      } else if (eDown && !eWasDown && dialogueOpen) {
        dialogueOpen = false;
        dialogue.style.display = 'none';
      }
      eWasDown = eDown;
      renderer.render(scene, camera);
    }
    animate();
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  </script>
</body>
</html>
