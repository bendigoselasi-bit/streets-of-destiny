<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STREETS OF DESTINY — Prototype</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07121d; color: #f6ead2; font-family: Georgia, 'Times New Roman', serif; }
    #hud, #mission { color: #f5e7c8; border: 1px solid #c99a4a88 !important; border-radius: 3px !important; background: linear-gradient(135deg, #071522ed, #152638df) !important; box-shadow: 0 12px 36px #0008, inset 0 0 22px #d4a04b12; letter-spacing: .03em; backdrop-filter: blur(10px); }
    #hud strong, #mission strong { color: #e5b65e; letter-spacing: .16em; font-size: 12px; }
    #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 2; padding: 10px 16px; border: 1px solid #c99a4a77; border-radius: 3px; background: #071522e8; color: #f5e7c8; white-space: nowrap; font: 12px system-ui, sans-serif; letter-spacing: .08em; }
    #dialogue { border: 1px solid #d5a44e !important; border-radius: 3px !important; background: linear-gradient(135deg, #071522f5, #1a2b3af5) !important; color: #f5e7c8; box-shadow: 0 16px 50px #000b; }
    #dialogue strong { color: #e5b65e; letter-spacing: .14em; text-transform: uppercase; }
    body:after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse at center, transparent 48%, #02081299 100%), linear-gradient(0deg, #02081244, transparent 28%, transparent 75%, #02081233); }
    canvas { display: block; }

    #mobileControls { display:none; position:fixed; inset:0; z-index:5; pointer-events:none; font:600 12px system-ui,sans-serif; }
    #stickBase { position:absolute;left:22px;bottom:28px;width:132px;height:132px;border:1px solid #e5b65e99;border-radius:50%;background:#07152299;pointer-events:auto;touch-action:none; }
    #stickKnob { position:absolute;left:43px;top:43px;width:44px;height:44px;border-radius:50%;background:#d5a44ecc;border:1px solid #ffe0a0;box-shadow:0 3px 14px #0009; }
    .mobileBtn { pointer-events:auto;touch-action:none;min-width:54px;min-height:48px;padding:8px;border:1px solid #d5a44e;border-radius:8px;background:#0b1b2bdc;color:#fff0d2;font-weight:700;box-shadow:0 4px 14px #0008; }
    #actionButtons { position:absolute;right:16px;bottom:24px;display:grid;grid-template-columns:repeat(2,58px);gap:9px; }
    #garageTouch { position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:none;gap:5px;pointer-events:auto; }
    #garageTouch .mobileBtn { min-width:42px;min-height:42px;padding:5px; }
    @media (pointer:coarse), (max-width:700px) {
      #mobileControls { display:block; }
      #hud { top:10px!important;left:10px!important;max-width:54vw;font-size:10px;padding:8px!important; }
      #hud strong { font-size:10px!important; }
      #mission { top:10px!important;right:10px!important;max-width:38vw!important;padding:8px!important;font-size:11px; }
      #savePanel { top:auto!important;left:10px!important;bottom:174px!important;gap:5px!important; }
      #savePanel button { padding:7px!important;font-size:9px; }
      #hint { display:none; }
      #dialogue { bottom:155px!important;width:calc(100% - 28px)!important;padding:11px!important;font-size:13px; }
    }
    @media (max-width:390px) {
      #stickBase { width:112px;height:112px;left:14px;bottom:22px; }
      #stickKnob { left:35px;top:35px;width:40px;height:40px; }
      #actionButtons { right:10px;bottom:18px;grid-template-columns:repeat(2,52px);gap:6px; }
      .mobileBtn { min-width:48px;min-height:44px; }
    }
  </style>
</head>
<body>
  <div id="hud"><strong>STREETS OF DESTINY</strong><br>BENEDICT’S STORY · NEW TOWN DISTRICT<br><span id="status">Playing as Benedict · Explore the neighbourhood</span></div>
  <div id="savePanel" style="position:fixed;top:112px;left:18px;z-index:3;display:flex;gap:7px"><button id="saveGame" style="padding:9px 12px;background:#14283a;color:#f5e7c8;border:1px solid #c99a4a;border-radius:3px;cursor:pointer">SAVE GAME</button><button id="loadGame" style="padding:9px 12px;background:#14283a;color:#f5e7c8;border:1px solid #c99a4a;border-radius:3px;cursor:pointer">LOAD GAME</button></div>
  <div id="hint">WASD / Arrows: move · Mouse drag: look · E: interact · F: enter/exit car · J: action pulse · Shift: dodge</div>
  <div id="mission" style="position:fixed;top:18px;right:18px;z-index:2;max-width:260px;padding:12px 16px;border:1px solid #ffffff33;border-radius:10px;background:#101820cc;line-height:1.5"><strong>FIRST MEETING</strong><br><span id="objective">Find Ama near the meeting point.</span></div>
  <div id="mobileControls" aria-label="Touch game controls">
    <div id="stickBase" aria-label="Movement joystick"><div id="stickKnob"></div></div>
    <div id="actionButtons">
      <button class="mobileBtn" data-key="e">INTERACT</button>
      <button class="mobileBtn" data-key="f">CAR</button>
      <button class="mobileBtn" data-key="j">ACTION</button>
      <button class="mobileBtn" data-key="shift">DODGE</button>
    </div>
    <div id="garageTouch">
      <button class="mobileBtn" data-key="1">1</button><button class="mobileBtn" data-key="2">2</button>
      <button class="mobileBtn" data-key="3">3</button><button class="mobileBtn" data-key="4">4</button>
      <button class="mobileBtn" data-key="5">SUV</button><button class="mobileBtn" data-key="6">SPORT</button>
    </div>
  </div>
  <div id="dialogue" style="display:none;position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:3;width:min(520px,calc(100% - 40px));padding:16px 18px;border:1px solid #ffffff55;border-radius:12px;background:#101820f2;line-height:1.55;text-align:center"><strong>Ama</strong><br><span id="dialogueText"></span><br><small>Press E to close</small></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x182b40);
    scene.fog = new THREE.Fog(0x182b40, 42, 125);

    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 250);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0x9bb9df, 0x1b2028, 1.25));
    const sun = new THREE.DirectionalLight(0xffc77a, 2.8);
    sun.position.set(-22, 28, 18);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -45; sun.shadow.camera.right = 45; sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
    scene.add(sun);
    const waterfrontGlow = new THREE.PointLight(0x4b9fc9, 18, 42, 2);
    waterfrontGlow.position.set(-9, 8, -72); scene.add(waterfrontGlow);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(180, 180), new THREE.MeshStandardMaterial({ color: 0x687568 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    function box(w,h,d,color,x,y,z) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({ color, roughness: 0.88 }));
      mesh.position.set(x,y,z); mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh); return mesh;
    }

    // Main road and pavements
    box(13, 0.12, 150, 0x343b40, 0, 0.06, 0);
    box(2.2, 0.2, 150, 0x9b9788, -7.6, 0.12, 0);
    box(2.2, 0.2, 150, 0x9b9788, 7.6, 0.12, 0);
    for (let z = -65; z < 70; z += 10) box(0.16, 0.025, 4.5, 0xe7d9a6, 0, 0.14, z);

    // Dark waterfront reflecting the blue-and-gold city lighting.
    const water = new THREE.Mesh(new THREE.PlaneGeometry(110, 38), new THREE.MeshStandardMaterial({ color: 0x102d42, metalness: 0.72, roughness: 0.22, emissive: 0x061725 }));
    water.rotation.x = -Math.PI / 2; water.position.set(-8, 0.025, -91); scene.add(water);
    for (let i = 0; i < 12; i++) {
      const glint = new THREE.Mesh(new THREE.BoxGeometry(0.08 + (i % 3) * 0.08, 0.015, 1.8 + (i % 4) * 0.6), new THREE.MeshBasicMaterial({ color: i % 2 ? 0x3b8fb4 : 0xc58c45, transparent: true, opacity: 0.28 }));
      glint.position.set(-26 + i * 3.2, 0.06, -88 - (i % 3) * 2.5); water.add(glint);
    }

    // Original fictional neighbourhood blocks
    const palette = [0xb77b55, 0xc8b28a, 0x8d9a91, 0xd0c4aa, 0x9d6958, 0xb5a18a];
    for (let i = 0; i < 22; i++) {
      const side = i % 2 ? 1 : -1;
      const z = -58 + i * 5.5;
      const h = 5 + (i % 5) * 1.8;
      const w = 5 + (i % 3);
      const x = side * (13 + (i % 2) * 2);
      box(w, h, 4.5, palette[i % palette.length], x, h / 2, z);
      for (let yy = 1.8; yy < h - 0.5; yy += 2.2) {
        for (let xx = -w/2 + 0.9; xx < w/2 - 0.3; xx += 1.7) {
          box(0.75, 0.9, 0.08, 0x344b59, x + xx, yy, z - 2.29);
        }
      }
    }


    // Street dressing: warm lamps, palms, and parked cars give New Town more lived-in scale.
    const lampBulbs = [];
    for (let i = 0; i < 9; i++) {
      const z = -60 + i * 15;
      const side = i % 2 ? 1 : -1;
      const x = side * 6.65;
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.12, 5.2, 10), new THREE.MeshStandardMaterial({ color: 0x28323a, metalness: 0.7, roughness: 0.4 }));
      pole.position.set(x, 2.6, z); pole.castShadow = true; scene.add(pole);
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.09, 0.09), pole.material);
      arm.position.set(x - side * 0.35, 5.05, z); scene.add(arm);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.19, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffd28a }));
      bulb.position.set(x - side * 0.68, 4.98, z); scene.add(bulb); lampBulbs.push(bulb);
    }
    function addPalm(x, z, scale = 1) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * scale, 0.28 * scale, 5.2 * scale, 9), new THREE.MeshStandardMaterial({ color: 0x795638, roughness: 1 }));
      trunk.position.set(x, 2.6 * scale, z); trunk.castShadow = true; scene.add(trunk);
      const crown = new THREE.Group(); crown.position.set(x, 5.05 * scale, z); scene.add(crown);
      for (let j = 0; j < 7; j++) {
        const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.34 * scale, 3.2 * scale, 5), new THREE.MeshStandardMaterial({ color: j % 2 ? 0x315d45 : 0x47724b, roughness: 0.9 }));
        leaf.position.y = -0.25 * scale; leaf.rotation.z = Math.PI / 2 + (j - 3) * 0.18; leaf.rotation.x = (j - 3) * 0.2; crown.add(leaf);
      }
    }
    addPalm(-9.1, -22, 0.9); addPalm(9.2, -47, 1.05); addPalm(-9.1, -58, 0.8);
    function addParkedCar(x, z, color) {
      const car = new THREE.Group();
      const paint = new THREE.MeshStandardMaterial({ color, metalness: 0.62, roughness: 0.28 });
      const glass = new THREE.MeshStandardMaterial({ color: 0x182d3a, metalness: 0.45, roughness: 0.18 });
      const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.05, 0.62, 4.15), paint);
      chassis.position.y = 0.72; chassis.castShadow = true; car.add(chassis);
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.72, 2.05), glass);
      cabin.position.set(0, 1.34, -0.12); cabin.castShadow = true; car.add(cabin);
      for (const wx of [-0.94, 0.94]) for (const wz of [-1.35, 1.35]) {
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.18, 14), new THREE.MeshStandardMaterial({ color: 0x11161b, roughness: 1 }));
        wheel.rotation.z = Math.PI / 2; wheel.position.set(wx, 0.42, wz); car.add(wheel);
      }
      car.position.set(x, 0, z); scene.add(car);
    }
    addParkedCar(-4.45, -7, 0x9b713d);
    addParkedCar(4.35, -29, 0x263e55);
    addParkedCar(-4.4, -51, 0x6d3330);

    // Benedict's personal arcade-style vehicle. F enters/exits; WASD steers and moves.
    const playerCar = new THREE.Group();
    const carPaint = new THREE.MeshStandardMaterial({ color: 0x263f58, metalness: 0.68, roughness: 0.27 });
    const carGlass = new THREE.MeshStandardMaterial({ color: 0x101f2b, metalness: 0.42, roughness: 0.16 });
    const carTrim = new THREE.MeshStandardMaterial({ color: 0xb88743, metalness: 0.72, roughness: 0.3 });
    const carBody = new THREE.Mesh(new THREE.BoxGeometry(1.95,0.62,4.05),carPaint);
    carBody.position.y=0.72; carBody.castShadow=true; playerCar.add(carBody);
    const carCabin = new THREE.Mesh(new THREE.BoxGeometry(1.62,0.78,2.0),carGlass);
    carCabin.position.set(0,1.35,-0.18); carCabin.castShadow=true; playerCar.add(carCabin);
    const hood = new THREE.Mesh(new THREE.BoxGeometry(1.8,0.12,1.0),carPaint);
    hood.position.set(0,1.03,-1.42); playerCar.add(hood);
    for(const wx of [-0.96,0.96]) for(const wz of [-1.35,1.35]) {
      const wheel=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.38,0.2,16),new THREE.MeshStandardMaterial({color:0x11161b,roughness:1}));
      wheel.rotation.z=Math.PI/2; wheel.position.set(wx,0.42,wz); playerCar.add(wheel);
    }
    for(const lx of [-0.62,0.62]) {
      const lamp=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.16,0.06),new THREE.MeshBasicMaterial({color:0xffe6ad}));
      lamp.position.set(lx,0.78,-2.04); playerCar.add(lamp);
      const tail=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.16,0.06),new THREE.MeshBasicMaterial({color:0xc83e35}));
      tail.position.set(lx,0.78,2.04); playerCar.add(tail);
    }
    const stripe=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.025,3.5),carTrim);
    stripe.position.set(0,1.05,0); playerCar.add(stripe);
    const roofRack = new THREE.Group();
    for (const x of [-0.62,0.62]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,1.9),carTrim);
      rail.position.set(x,1.86,-0.18); roofRack.add(rail);
    }
    playerCar.add(roofRack);
    const sportSpoiler = new THREE.Group();
    const spoilerBar = new THREE.Mesh(new THREE.BoxGeometry(1.75,0.1,0.22),carTrim);
    spoilerBar.position.set(0,1.52,1.85); sportSpoiler.add(spoilerBar);
    for (const x of [-0.62,0.62]) {
      const support = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.34,0.1),carTrim);
      support.position.set(x,1.34,1.83); sportSpoiler.add(support);
    }
    playerCar.add(sportSpoiler);
    roofRack.visible=false; sportSpoiler.visible=false;
    const vehicleTypes=[
      {name:'Executive Sedan',unlock:0,maxSpeed:18,body:new THREE.BoxGeometry(1.95,0.62,4.05),cabin:new THREE.BoxGeometry(1.62,0.78,2.0),bodyY:0.72,cabinY:1.35,hoodY:1.03,hoodZ:-1.42},
      {name:'City SUV',unlock:5,maxSpeed:15,body:new THREE.BoxGeometry(2.02,0.78,4.15),cabin:new THREE.BoxGeometry(1.72,0.96,2.15),bodyY:0.8,cabinY:1.55,hoodY:1.2,hoodZ:-1.48},
      {name:'Sport Coupe',unlock:8,maxSpeed:22,body:new THREE.BoxGeometry(1.98,0.55,4.1),cabin:new THREE.BoxGeometry(1.65,0.58,1.65),bodyY:0.68,cabinY:1.2,hoodY:0.98,hoodZ:-1.46}
    ];
    let selectedVehicle=0;
    function selectVehicle(index) {
      const type=vehicleTypes[index];
      if (missionStage < type.unlock) {
        dialogueText.textContent=type.name+' is locked. Continue the story to unlock it.';
        status.textContent=type.name+' locked — progress through the story';
        return;
      }
      selectedVehicle=index;
      carBody.geometry.dispose(); carBody.geometry=type.body.clone(); carBody.position.y=type.bodyY;
      carCabin.geometry.dispose(); carCabin.geometry=type.cabin.clone(); carCabin.position.y=type.cabinY;
      hood.position.y=type.hoodY; hood.position.z=type.hoodZ;
      roofRack.visible=index===1; sportSpoiler.visible=index===2;
      status.textContent='Garage: '+type.name+' selected';
      dialogueText.textContent=type.name+' selected. Choose a paint finish with 1–4, or press E to leave.';
    }
    playerCar.position.set(0,0,18); scene.add(playerCar);
    let driving=false, carSpeed=0, carSteer=0;

    // New Town garage: a safe vehicle-customisation stop.
    box(8.5,5.4,5.2,0x34424a,4.2,2.7,65);
    box(6.8,3.4,0.22,0x101d27,4.2,2.1,62.35);
    box(7.2,0.28,0.35,0xc18b43,4.2,5.55,62.2);
    const garageMarker = new THREE.Group();
    const garageRing = new THREE.Mesh(new THREE.TorusGeometry(1.05,0.12,8,32),new THREE.MeshStandardMaterial({color:0xffd16c,emissive:0x79501c}));
    garageRing.rotation.x=Math.PI/2; garageRing.position.y=0.18; garageMarker.add(garageRing);
    garageMarker.position.set(4.2,0,55); scene.add(garageMarker);
    let garageOpen=false;
    const garagePaints=[
      {name:'Midnight Blue',body:0x263f58,trim:0xb88743,glass:0x101f2b},
      {name:'Obsidian Black',body:0x171c25,trim:0x8f9aa4,glass:0x080d14},
      {name:'Burgundy',body:0x642c36,trim:0xd0a15d,glass:0x17121a},
      {name:'Pearl Silver',body:0x9da9b1,trim:0xd6b36e,glass:0x263b49}
    ];
    function applyGaragePaint(index) {
      savedPaint=index;
      const paint=garagePaints[index];
      carPaint.color.setHex(paint.body); carTrim.color.setHex(paint.trim); carGlass.color.setHex(paint.glass);
      status.textContent='Garage: '+paint.name+' selected';
      dialogueText.textContent=paint.name+' finish applied. Choose another finish or press E to leave the garage.';
    }

    // Slow ambient traffic: simple original vehicles loop along the boulevard.
    const traffic = [];
    function addTrafficCar(x, z, color, speed, directionZ) {
      const car = new THREE.Group();
      const paint = new THREE.MeshStandardMaterial({ color, metalness: 0.48, roughness: 0.34 });
      const glass = new THREE.MeshStandardMaterial({ color: 0x142b3a, metalness: 0.35, roughness: 0.2 });
      const base = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.58, 3.45), paint);
      base.position.y = 0.65; base.castShadow = true; car.add(base);
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.62, 1.65), glass);
      cabin.position.set(0, 1.18, -0.12); cabin.castShadow = true; car.add(cabin);
      for (const wx of [-0.82, 0.82]) for (const wz of [-1.08, 1.08]) {
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.29, 0.14, 12), new THREE.MeshStandardMaterial({ color: 0x11161b }));
        wheel.rotation.z = Math.PI / 2; wheel.position.set(wx, 0.36, wz); car.add(wheel);
      }
      const lamps = new THREE.MeshBasicMaterial({ color: 0xffe3a6 });
      for (const lx of [-0.53, 0.53]) {
        const headlamp = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.13, 0.05), lamps);
        headlamp.position.set(lx, 0.72, -1.74); car.add(headlamp);
      }
      car.position.set(x, 0, z); car.rotation.y = directionZ > 0 ? Math.PI : 0; scene.add(car);
      traffic.push({ car, speed, directionZ });
    }
    addTrafficCar(-2.35, 43, 0x9a3d32, 3.2, -1);
    addTrafficCar(2.25, -43, 0xc0a15e, 2.6, 1);
    addTrafficCar(-2.35, -2, 0x31566b, 2.9, -1);

    // A few neighbourhood pedestrians add life to the sidewalks.
    const pedestrians = [];
    function addPedestrian(x, z, shirt, phase) {
      const person = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color: 0x80543d, roughness: 0.9 });
      const top = new THREE.MeshStandardMaterial({ color: shirt, roughness: 0.85 });
      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 0.62, 3, 7), top);
      torso.position.y = 1.08; torso.castShadow = true; person.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.19, 12, 10), skin);
      head.position.y = 1.72; head.castShadow = true; person.add(head);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x242a31, roughness: 0.95 });
      const legs = [];
      for (const side of [-1, 1]) {
        const leg = new THREE.Group(); leg.position.set(side * 0.13, 0.75, 0); person.add(leg);
        const limb = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.48, 3, 6), legMat);
        limb.position.y = -0.27; limb.castShadow = true; leg.add(limb); legs.push(leg);
      }
      person.position.set(x, 0, z); scene.add(person);
      pedestrians.push({ person, legs, phase, originX: x, originZ: z });
    }
    addPedestrian(-8.05, -16, 0x8a583c, 0.4);
    addPedestrian(8.05, -34, 0x3c6870, 2.1);
    addPedestrian(-8.05, 26, 0x9a873e, 3.4);
    addPedestrian(8.05, 51, 0x644d82, 4.7);

    // Enterable neighbourhood market and waterfront cafe.
    function businessMarker(x,z,color) {
      box(2.8,2.8,0.22,color,x,1.4,z-1.15); box(3.1,0.22,1.15,0x26343b,x,2.9,z-1.1);
      box(2.35,0.95,0.18,0x172c39,x,1.25,z-0.99);
      const g=new THREE.Group(); const ring=new THREE.Mesh(new THREE.TorusGeometry(0.9,0.1,8,28),new THREE.MeshStandardMaterial({color:0xffd16c,emissive:0x79501c}));

    let stickPointer=null;

    stickBase.addEventListener('pointerdown',e=>{stickPointer=e.pointerId;stickBase.setPointerCapture(e.pointerId);moveStick(e);});
    stickBase.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)moveStick(e);});
    function moveStick(e){
      const r=stickBase.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
      let dx=e.clientX-cx,dy=e.clientY-cy; const max=r.width*0.34, len=Math.hypot(dx,dy);
      if(len>max){dx=dx/len*max;dy=dy/len*max;}
      stickKnob.style.transform='translate('+dx+'px,'+dy+'px)';
      keys.d=dx>17;keys.a=dx< -17;keys.s=dy>17;keys.w=dy< -17;
    }
    function releaseStick(e){if(e.pointerId===stickPointer){stickPointer=null;clearStick();}}
    stickBase.addEventListener('pointerup',releaseStick);stickBase.addEventListener('pointercancel',releaseStick);
    document.querySelectorAll('.mobileBtn').forEach(btn=>{
      const key=btn.dataset.key;
      const press=e=>{e.preventDefault();keys[key]=true;};
      const release=e=>{e.preventDefault();keys[key]=false;};
      btn.addEventListener('pointerdown',press);btn.addEventListener('pointerup',release);
      btn.addEventListener('pointercancel',release);btn.addEventListener('pointerleave',release);
    });

    const status = document.getElementById('status');
    const objective = document.getElementById('objective');
    const dialogue = document.getElementById('dialogue');
    const dialogueText = document.getElementById('dialogueText');
    let missionStage = 0;
    let savedPaint = 0;
    const SAVE_KEY = 'streetsOfDestiny.save.v1';
    function saveGame(showMessage=true) {
      const data = {
        version: 1, missionStage, selectedVehicle, savedPaint,
        player: {x: player.position.x, z: player.position.z, yaw: player.rotation.y},
        car: {x: playerCar.position.x, z: playerCar.position.z, yaw: playerCar.rotation.y}
      };
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
        if(showMessage) status.textContent = 'Game saved on this device';
        return true;
      } catch (error) {
        if(showMessage) status.textContent = 'Save unavailable in this browser';
        return false;
      }
    }
    function loadGame(showMessage=true) {
      try {
        const raw=localStorage.getItem(SAVE_KEY);
        if(!raw) { if(showMessage) status.textContent='No saved game found on this device'; return false; }
        const data=JSON.parse(raw);
        if(data.version!==1) throw new Error('Unsupported save version');
        missionStage=THREE.MathUtils.clamp(Number(data.missionStage)||0,0,10);
        selectedVehicle=0;
        selectVehicle(THREE.MathUtils.clamp(Number(data.selectedVehicle)||0,0,2));
        savedPaint=THREE.MathUtils.clamp(Number(data.savedPaint)||0,0,3);
        applyGaragePaint(savedPaint);
        player.position.set(
          THREE.MathUtils.clamp(Number(data.player?.x)||0,-5.5,5.5),0,
          THREE.MathUtils.clamp(Number(data.player?.z)||0,-72,72)
        );
        player.rotation.y=Number(data.player?.yaw)||0;
        playerCar.position.set(
          THREE.MathUtils.clamp(Number(data.car?.x)||0,-5.5,5.5),0,
          THREE.MathUtils.clamp(Number(data.car?.z)||18,-72,72)
        );
        playerCar.rotation.y=Number(data.car?.yaw)||0;
        objective.textContent = missionStage===0 ? 'Find Ama near the meeting point.' : 'Story progress restored. Continue your journey.';
        if(showMessage) status.textContent='Saved game loaded — welcome back to New Town';
        return true;
      } catch(error) {
        if(showMessage) status.textContent='Save could not be loaded; start a new journey';
        return false;
      }
    }
    document.getElementById('saveGame').addEventListener('click',()=>saveGame(true));
    document.getElementById('loadGame').addEventListener('click',()=>loadGame(true));
    let dialogueOpen = false;
    let eWasDown = false;
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.04);
      if (Math.floor(clock.elapsedTime) % 12 === 0 && clock.elapsedTime % 1 < dt) saveGame(false);
      for (const vehicle of traffic) {
        vehicle.car.position.z += vehicle.speed * vehicle.directionZ * dt;
        if (vehicle.car.position.z > 74) vehicle.car.position.z = -74;
        if (vehicle.car.position.z < -74) vehicle.car.position.z = 74;
      }
      for (const walker of pedestrians) {
        walker.phase += dt * 3.2;
        const stride = Math.sin(walker.phase) * 0.34;
        walker.legs[0].rotation.x = stride;
        walker.legs[1].rotation.x = -stride;
        walker.person.position.x = walker.originX + Math.sin(walker.phase * 0.22) * 0.28;
      }
      const forward = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
      const sideways = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
      const dodging = !!keys.shift && !driving;
      if (driving) {
        carSpeed = THREE.MathUtils.clamp(carSpeed + forward * dt * 10, -5, vehicleTypes[selectedVehicle].maxSpeed);
        if (!forward) carSpeed *= Math.pow(0.985, dt * 60);
        playerCar.rotation.y += sideways * dt * (0.9 + Math.abs(carSpeed) * 0.035) * (carSpeed < 0 ? -1 : 1);
        playerCar.position.x += Math.sin(playerCar.rotation.y) * carSpeed * dt;
        playerCar.position.z -= Math.cos(playerCar.rotation.y) * carSpeed * dt;
        playerCar.position.x = THREE.MathUtils.clamp(playerCar.position.x,-5.5,5.5);
        playerCar.position.z = THREE.MathUtils.clamp(playerCar.position.z,-72,72);
        player.position.copy(playerCar.position);
        player.visible = false;
        player.rotation.y = playerCar.rotation.y;
      } else {
        const direction = new THREE.Vector3(sideways, 0, -forward).normalize().applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
        player.position.addScaledVector(direction, dt * (dodging ? 10 : 7));
        player.position.x = THREE.MathUtils.clamp(player.position.x, interiorMode ? roomX-6.2 : -5.5, interiorMode ? roomX+6.2 : 5.5);
        player.position.z = THREE.MathUtils.clamp(player.position.z, interiorMode ? roomZ-6.2 : -72, interiorMode ? roomZ+6.2 : 72);
      }
      const moving = direction.lengthSq() > 0.001;
      if (moving) player.rotation.y = Math.atan2(direction.x, direction.z);
      gaitTime += dt * (dodging ? 13 : 9);
      const gait = moving ? Math.sin(gaitTime) : 0;
      const walkBlend = THREE.MathUtils.lerp(0, 1, moving ? 1 : 0);
      leftLeg.rotation.x = gait * 0.48 * walkBlend;
      rightLeg.rotation.x = -gait * 0.48 * walkBlend;
      leftArm.rotation.x = -gait * 0.34 * walkBlend;
      rightArm.rotation.x = gait * 0.34 * walkBlend;
      player.position.y = moving ? Math.abs(Math.sin(gaitTime * 2)) * 0.045 : 0;
      const pulsePressed = !!keys.j && pulseCooldown <= 0.08;
      actionPose = THREE.MathUtils.lerp(actionPose, pulsePressed ? 1 : 0, Math.min(1, dt * 10));
      rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, -1.15, actionPose);
      rightArm.rotation.z = THREE.MathUtils.lerp(rightArm.rotation.z, -0.22, actionPose);
      leftArm.rotation.z = THREE.MathUtils.lerp(leftArm.rotation.z, 0.18, dodging ? 1 : 0);
      body.rotation.x = THREE.MathUtils.lerp(body.rotation.x, dodging ? 0.18 : 0, Math.min(1, dt * 7));
      ring.rotation.z += dt * 0.7;
      const inEncounterZone = player.position.z < -17 && player.position.z > -36;
      if (missionStage >= 3 && inEncounterZone && !encounterWon) {
        if (!combatStarted) {
          combatStarted = true;
          objective.textContent = 'A pair of rivals are blocking the street. Use J for a non-lethal action pulse and Shift to dodge.';
          status.textContent = 'Street encounter — create space';
        }
        combatPanel.style.display = 'block';
        const combatStatus = document.getElementById('combatStatus');
        pulseCooldown = Math.max(0, pulseCooldown - dt);
        if (keys.j && pulseCooldown === 0) {
          pulseCooldown = 0.72; pulseRing.position.set(player.position.x, 0.18, player.position.z);
          pulseRing.scale.setScalar(0.2); pulseRing.material.opacity = 0.85;
          for (const rival of rivals) if (rival.active && rival.group.position.distanceTo(player.position) < 4.4) {
            rival.composure = Math.max(0, rival.composure - 36);
            rival.fill.scale.x = Math.max(0.001, rival.composure / 100);
            rival.fill.position.x = -0.625 * (1 - rival.composure / 100);
            rival.hitFlash = 0.22;
            if (rival.composure === 0) { rival.active = false; rival.retreating = true; rival.bar.visible = false; }
          }
        }
        pulseRing.scale.multiplyScalar(1 + dt * 5);
        pulseRing.material.opacity = Math.max(0, pulseRing.material.opacity - dt * 1.8);
        let remaining = 0;
        for (const rival of rivals) {
          rival.hitFlash = Math.max(0, rival.hitFlash - dt);
          rival.gait += dt * (rival.retreating ? 12 : 7);
          const step = Math.sin(rival.gait) * (rival.retreating || rival.active ? 0.42 : 0);
          rival.legs[0].rotation.x = step;
          rival.legs[1].rotation.x = -step;
          rival.arms[0].rotation.x = -step * 0.65;
          rival.arms[1].rotation.x = step * 0.65;
          rival.torso.rotation.z = THREE.MathUtils.lerp(rival.torso.rotation.z, rival.hitFlash > 0 ? 0.18 : 0, Math.min(1, dt * 9));
          rival.group.position.y = rival.hitFlash > 0 ? 0.1 : 0;
          if (rival.retreating) {
            const away = rival.group.position.clone().sub(player.position); away.y = 0;
            if (away.lengthSq() > 0.01) {
              away.normalize();
              rival.group.position.addScaledVector(away, dt * 4.8);
              rival.group.rotation.y = Math.atan2(away.x, away.z);
            }
            if (rival.group.position.distanceTo(player.position) > 15) {
              rival.retreating = false;
              rival.group.visible = false;
            }
          } else if (rival.active) {
            remaining++;
            const offset = player.position.clone().sub(rival.group.position); offset.y = 0;
            if (offset.length() > 2.1) {
              rival.group.position.addScaledVector(offset.normalize(), dt * 1.25);
              rival.group.rotation.y = Math.atan2(-offset.x, -offset.z);
            }
            rival.bar.position.set(rival.group.position.x, 3, rival.group.position.z);
            rival.bar.lookAt(camera.position);
            if (rival.group.position.distanceTo(player.position) < 1.5 && !dodging) playerFocus = Math.max(0, playerFocus - dt * 7);
          }
        }
        combatStatus.textContent = remaining ? 'J: action pulse · Shift: dodge · Focus: ' + Math.round(playerFocus) + '%' : 'The rivals have backed off. The street is clear.';
        if (remaining === 0) {
          encounterWon = true; combatPanel.style.display = 'block';
          objective.textContent = 'Street encounter resolved. Continue the story.';
          status.textContent = 'The rivals have backed off';
        }
        if (playerFocus <= 0) {
          playerFocus = 100; player.position.set(0, 0, -18);
          combatStatus.textContent = 'Benedict took a breather and regrouped. Try again.';
        }
      } else if (combatStarted && encounterWon) combatPanel.style.display = 'none';

      for (let i = 0; i < lampBulbs.length; i++) lampBulbs[i].material.color.setHex(Math.sin(clock.elapsedTime * 2.1 + i) > -0.92 ? 0xffd28a : 0xb77d48);
      const cameraYaw = driving ? playerCar.rotation.y : yaw;
      const target = player.position.clone().add(new THREE.Vector3(0, driving ? 4.2 : 3.2, driving ? 10 : 7.5).applyAxisAngle(new THREE.Vector3(0,1,0), cameraYaw));
      camera.position.lerp(target, 0.09);
      camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
      const nearAma = player.position.distanceTo(ama.position) < 3.2;
      const nearWorkshop = player.position.distanceTo(workshopMarker.position) < 3.4;
      const nearKofi = player.position.distanceTo(kofi.position) < 3.2;
      const nearBenedict = player.position.distanceTo(benedict.position) < 3.5;
      const nearOffice = player.position.distanceTo(officeMarker.position) < 3.4;
      const nearNana = player.position.distanceTo(nana.position) < 3.2;
      const nearMeeting = player.position.distanceTo(meetingMarker.position) < 3.4;
      const nearBendigoSupport = player.position.distanceTo(bendigo.position) < 3.2;
      const nearPlayerCar = !driving && !interiorMode && player.position.distanceTo(playerCar.position) < 3.8;
      const nearGarage = !driving && !interiorMode && player.position.distanceTo(garageMarker.position) < 3.5;
      const nearMarket = !interiorMode && player.position.distanceTo(marketMarker.position) < 3.2;
      const nearCafe = !interiorMode && player.position.distanceTo(cafeMarker.position) < 3.2;
      const nearHouse = !interiorMode && player.position.distanceTo(houseMarker.position) < 3.5;
      const eDown = !!keys.e;
      document.getElementById('garageTouch').style.display = garageOpen ? 'flex' : 'none';
      if (driving) status.textContent = 'Driving Benedict’s car — W/S accelerate and reverse · A/D steer · F exit';
      else if (garageOpen) status.textContent = 'Garage open — press 1–4 to customise · E to close';
      else if (nearGarage) status.textContent = 'New Town Garage — press E to customise Benedict’s car';
      else if (nearPlayerCar) status.textContent = 'Benedict’s car — press F to drive';
      else if (interiorMode) status.textContent = 'Inside ' + (interiorMode==='market'?'New Town Market':interiorMode==='house'?'Benedict’s Home':'Harbour Cafe') + ' — press E to exit';
      else if (nearMarket) status.textContent = 'New Town Market — press E to enter';
      else if (nearCafe) status.textContent = 'Harbour Cafe — press E to enter';
      else if (nearHouse) status.textContent = 'Benedict’s Home — press E to enter';
      else if (nearAma && missionStage === 0) status.textContent = 'Ama is nearby — press E to talk';
      else if (nearWorkshop && missionStage === 1) status.textContent = 'Community workshop — press E to enter';
      else if (nearKofi && missionStage === 2) status.textContent = 'Kofi is ready to talk — press E';
      else if (nearBenedict && missionStage === 3) status.textContent = 'A stranger is waiting — press E';
      else if (nearAma && missionStage === 4) status.textContent = 'Ask Ama about the Patron — press E';
      else if (nearOffice && missionStage === 5) status.textContent = 'the Patron’s waterfront office — press E';
      else if (nearNana && missionStage === 6) status.textContent = 'Nana is ready to speak — press E';
      else if (nearMeeting && missionStage === 7) status.textContent = 'the Patron’s private meeting — press E';
      else if (missionStage === 8) status.textContent = 'Choose: press 1 to hear him out or 2 to decline';
      else if (missionStage === 9) status.textContent = 'The Patron has shared a confidential proposal';
      else if (missionStage === 10) status.textContent = 'You declined the Patron’s invitation';
      else status.textContent = 'Explore the neighbourhood';

      if (nearBendigoSupport && eDown && !eWasDown && !dialogueOpen) {
        dialogueOpen=true; dialogue.style.display='block';
        dialogue.querySelector('strong').textContent='Bendigo — Trusted Ally';
        dialogueText.textContent='Benedict, I have been keeping an eye on the workshop and the people around it. The Patron talks about renewal, but promises are easy. Let us listen carefully, ask the neighbours what they need, and make sure their voices stay part of every decision.';
      } else if (keys.f && !driving && nearPlayerCar) {
        driving = true; carSpeed = 0; playerCar.position.set(player.position.x,0,player.position.z);
        playerCar.rotation.y = player.rotation.y; player.visible = false;
        status.textContent = 'Driving Benedict’s car — W/S accelerate and reverse · A/D steer · F exit';
        keys.f = false;
      } else if (keys.f && driving) {
        driving = false; carSpeed = 0; player.visible = true;
        player.position.set(THREE.MathUtils.clamp(playerCar.position.x+1.5,-5.2,5.2),0,playerCar.position.z);
        keys.f = false;
      } else if (garageOpen && eDown && !eWasDown) {
        garageOpen=false; dialogueOpen=false; dialogue.style.display='none';
      } else if (garageOpen && keys['1']) {
        applyGaragePaint(0); keys['1']=false;
      } else if (garageOpen && keys['2']) {
        applyGaragePaint(1); keys['2']=false;
      } else if (garageOpen && keys['3']) {
        applyGaragePaint(2); keys['3']=false;
      } else if (garageOpen && keys['4']) {
        applyGaragePaint(3); keys['4']=false;
      } else if (garageOpen && keys['5']) {
        selectVehicle(1); keys['5']=false;
      } else if (garageOpen && keys['6']) {
        selectVehicle(2); keys['6']=false;
      } else if (nearGarage && eDown && !eWasDown) {
        garageOpen=true; dialogueOpen=true; dialogue.style.display='block';
        dialogue.querySelector('strong').textContent='New Town Garage';
        dialogueText.textContent='Choose a vehicle: 1 Sedan (available), 5 SUV (unlocks at story chapter 5), 6 Sport Coupe (unlocks at chapter 8). Paint: 1 Blue, 2 Black, 3 Burgundy, 4 Silver. Press E to close.';
      } else if (interiorMode && eDown && !eWasDown) {
        const wasMarket = interiorMode === 'market';
        const wasHouse = interiorMode === 'house';
        interiorMode = ''; marketRoom.visible = false; cafeRoom.visible = false; houseRoom.visible = false;
        player.position.set(wasHouse ? -4.2 : wasMarket ? 4.1 : -4.1, 0, wasHouse ? 59.5 : wasMarket ? 15.2 : -39.8);
        dialogueOpen = false; dialogue.style.display = 'none';
      } else if (nearHouse && eDown && !eWasDown) {
        interiorMode='house'; houseRoom.visible=true; marketRoom.visible=false; cafeRoom.visible=false;
        player.position.set(roomX,0,roomZ+5.2);
        dialogueOpen=true; dialogue.style.display='block';
        dialogue.querySelector('strong').textContent='Benedict’s Home';
        dialogueText.textContent='A quiet place to call your own. The living room looks out toward the harbour, while the bedroom offers a little peace after a long day. Your parking bay is outside. Press E to step back into New Town.';
      } else if (nearMarket && eDown && !eWasDown) {
        interiorMode='market'; marketRoom.visible=true; cafeRoom.visible=false;
        player.position.set(roomX,0,roomZ+5.2);
        dialogueOpen=true; dialogue.style.display='block';
        dialogue.querySelector('strong').textContent='New Town Market';
        dialogueText.textContent='Welcome to the neighbourhood market. Local goods and everyday essentials line the shelves. Press E whenever you are ready to step outside.';
      } else if (nearCafe && eDown && !eWasDown) {
        interiorMode='cafe'; cafeRoom.visible=true; marketRoom.visible=false;
        player.position.set(roomX,0,roomZ+5.2);
        dialogueOpen=true; dialogue.style.display='block';
        dialogue.querySelector('strong').textContent='Harbour Cafe';
        dialogueText.textContent='A calm little cafe near the waterfront, with tables for neighbours to catch up. Press E to leave and return to New Town.';
      } else if (nearAma && eDown && !eWasDown && missionStage === 0) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Ama';
        dialogueText.textContent = 'Benedict? It has been a long time. The neighbourhood has changed, but people still remember you. Come by the workshop when you are ready.';
        missionStage = 1;
        objective.textContent = 'Completed: Meet Ama. Next: Visit the community workshop.';
      } else if (nearWorkshop && eDown && !eWasDown && missionStage === 1) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Community workshop';
        dialogueText.textContent = 'The workshop is still a place where neighbours share skills and help one another. Ama has left a note for you: start by checking in with the people who kept this place running.';
        missionStage = 2;
        objective.textContent = 'Completed: Visit the community workshop. Next: Speak with Kofi.';
      } else if (nearKofi && eDown && !eWasDown && missionStage === 2) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Kofi';
        dialogueText.textContent = 'Ama said you might come by. We are trying to keep this workshop open for the young people in the area. The roof needs repairs, and the neighbours are organising a weekend fundraiser. If you want to help, speak with Ama about how to bring everyone together.';
        missionStage = 3;
        objective.textContent = 'Chapter 1 introduction complete. Next: Find Ama and discuss the community fundraiser.';
        status.textContent = 'Chapter 1 introduction complete';
      } else if (nearBenedict && eDown && !eWasDown && missionStage === 3) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'The Patron — A Powerful Stranger';
        dialogueText.textContent = 'You have been asking questions about this neighbourhood, Benedict. Names carry weight here, and mine opens doors you have not even noticed yet. I can offer you an opportunity, but first you should decide who you can trust. We will speak again.';
        missionStage = 4;
        objective.textContent = 'New contact: The Patron. A powerful stranger has taken an interest in Benedict. Find out why.';
      } else if (nearAma && eDown && !eWasDown && missionStage === 4) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Ama';
        dialogueText.textContent = 'The Patron? I know the name. He has funded projects around New Town, but nobody seems to know where his money really comes from. Some people admire him; others keep their distance. If he has approached you, Benedict, take your time before accepting anything. I heard he has an office near the old waterfront. That may be your next lead.';
        missionStage = 5;
        objective.textContent = 'New lead: Ask around about the Patron’s waterfront office. Find out why he is interested in Benedict.';
      } else if (nearOffice && eDown && !eWasDown && missionStage === 5) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Waterfront Office';
        dialogueText.textContent = 'The building is quieter than the busy street outside. A discreet reception desk sits behind the glass entrance. A woman notices Benedict approaching and steps outside to meet him.';
        missionStage = 6;
        objective.textContent = 'At the waterfront office: Speak with Nana, the office coordinator.';
      } else if (nearNana && eDown && !eWasDown && missionStage === 6) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'Nana — Office Coordinator';
        dialogueText.textContent = 'You must be Benedict. The Patron said you might come by. He is away at the moment, but he left a message: he would like to meet you privately tomorrow. I cannot tell you what he wants. You will have to ask him yourself.';
        missionStage = 7;
        objective.textContent = 'New objective: Decide whether to accept the Patron’s invitation. Chapter 1 continues.';
      } else if (nearMeeting && eDown && !eWasDown && missionStage === 7) {
        benedict.position.set(2.7, 0, -69);
        benedict.rotation.y = Math.PI;
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'The Patron — Private Meeting';
        dialogueText.textContent = 'Benedict, I have watched how you returned to this neighbourhood and listened before making promises. I am putting together a city renewal initiative. I want you involved, but trust should never be demanded. You have a choice: hear my proposal, or walk away. Press 1 to hear him out, or 2 to decline.';
        missionStage = 8;
        objective.textContent = 'Decision: Will Benedict hear the Patron’s proposal or decline the invitation?';
      } else if (missionStage === 8 && keys['1']) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'The Patron — The Proposal';
        dialogueText.textContent = 'Good. I want to restore the waterfront and create paid training opportunities through the workshop. The plan is ambitious, and I will show you the details before asking for any commitment. Meet me again when you are ready to review them.';
        missionStage = 9;
        objective.textContent = 'New objective: Review the Patron’s waterfront renewal proposal before making any commitment.';
      } else if (missionStage === 8 && keys['2']) {
        dialogueOpen = true;
        dialogue.style.display = 'block';
        dialogue.querySelector('strong').textContent = 'The Patron — A Different Path';
        dialogueText.textContent = 'I respect a careful decision, Benedict. The invitation will remain open. Take time to understand what matters to you and the people here. We may speak again.';
        missionStage = 10;
        objective.textContent = 'You declined for now. Continue helping the New Town community; the Patron’s invitation may return later.';
      } else if (eDown && !eWasDown && dialogueOpen) {
        dialogueOpen = false;
        dialogue.style.display = 'none';
      }
      eWasDown = eDown;
      renderer.render(scene, camera);
    }
    loadGame(false);
    addEventListener('beforeunload',()=>saveGame(false));
    animate();
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  </script>
</body>
</html>
